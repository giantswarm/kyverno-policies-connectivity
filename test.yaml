# Source: kyverno-policies-connectivity/templates/WorkloadClusterIpJob.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: "policies-prepare-cm-preinstall-hook"
  namespace: "default"
  annotations:
    "helm.sh/hook-delete-policy": "before-hook-creation,hook-succeeded,hook-failed"
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "0"
spec:
  ttlSecondsAfterFinished: 86400 # 24h
  template:
    metadata:
      name: "policies-prepare-cm-preinstall-hook"
      namespace: "default"
    spec:
      restartPolicy: Never
      serviceAccountName: "policies-read-write-configmap"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: pre-install-job
          image: "gsoci.azurecr.io/giantswarm/kubectl:1.26.0"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command:
            - "/bin/bash"
            - "-xec"
            - "-o"
            - "pipefail"
            - |
              cat > /tmp/cm.yaml <<EOF
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: "policies-wc-allowed-ips"
                namespace: "default"
                labels:
                  app.kubernetes.io/instance: policies
                  helm.sh/chart: kyverno-policies-connectivity-0.10.2
              data:
                allowed-ips: |
              EOF

              # calculate the range based on MC's control plane ip
              cp_ip=$(kubectl get cm kubeadm-config -n kube-system -ojsonpath={.data.ClusterConfiguration} | grep controlPlaneEndpoint: | cut -d' ' -f2 | cut -d':' -f1)
              last_ip_chunk=$(echo ${cp_ip} | cut -d'.' -f4)
              ip_prefix=$(echo ${cp_ip} | cut -d'.' -f1-3)
              ip_start=$(( last_ip_chunk + 2 ))
              ip_end=$(( last_ip_chunk + 2 + 8 > 254 ? 254 : last_ip_chunk + 2 + 8 ))
              for i in $(seq ${ip_start} ${ip_end}); do
                echo "    - \"${ip_prefix}.${i}\"" >> /tmp/cm.yaml
              done

              set +x
              echo -e "\n\nApplying following configmap:\n-----------------------------"
              cat /tmp/cm.yaml
              # piping stderr to stdout means kubectl's errors are surfaced
              # in the pod's logs.
              kubectl apply --server-side=true --field-manager='kubectl-client-side-apply' --force-conflicts -f /tmp/cm.yaml 2>&1

          resources:
            requests:
              memory: "64Mi"
              cpu: "10m"
            limits:
              memory: "256Mi"
              cpu: "100m"

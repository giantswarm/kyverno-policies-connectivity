apiVersion: v1
kind: Pod
metadata:
  name: test-pod-proxy-inject
  namespace: default
spec:
  containers:
  - name: test-container
    env:
    - name: HTTP_PROXY
      value: http://proxy.example.com:3128
    - name: http_proxy
      value: http://proxy.example.com:3128
    - name: HTTPS_PROXY
      value: http://proxy.example.com:3128
    - name: https_proxy
      value: http://proxy.example.com:3128
    - name: NO_PROXY
      value: localhost,127.0.0.1,.cluster.local,svc,127.0.0.1,localhost,crossplane,barman-cloud,10.0.0.1,cluster.local,cluster.local.,10.244.0.0/16,10.96.0.0/12
    - name: no_proxy
      value: localhost,127.0.0.1,.cluster.local,svc,127.0.0.1,localhost,crossplane,barman-cloud,10.0.0.1,cluster.local,cluster.local.,10.244.0.0/16,10.96.0.0/12

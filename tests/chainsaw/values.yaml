# Values used to install the chart for the chainsaw tests (make install-policies).
# The chart ships every policy disabled by default, so enable the ones the
# tests assert on here.
proxy:
  enabled: true
  namespaces: ["default", "kube-system", "kube-public"]

cluster:
  name: "chainsaw-test"
  proxy:
    http: "http://proxy.example.com:3128"
    https: "http://proxy.example.com:3128"
    noProxy: "localhost,127.0.0.1,.cluster.local"

certManager:
  syncSecret: true
  sourceNamespace: "default"
  targetNamespace: "org-*"

cel:
  enabled: false

wcIpCheck:
  enabled: true
  infraClusterNames:
  - VSphereCluster
  exclude:
    names:
    - excluded-by-name
  deriveFromControlPlaneEndpoint:
    enabled: true

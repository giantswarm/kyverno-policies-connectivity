# Values used to install the chart for the chainsaw tests (make install-policies).
# The chart ships every policy disabled by default, so enable the ones the
# tests assert on here.
proxy:
  enabled: true
  namespaces: ["default", "kube-system", "kube-public"]

cluster:
  name: "test"
  proxy:
    http: "http://proxy.example.com:8080"
    https: "https://proxy.example.com:8080"
    noProxy: ""

certManager:
  syncSecret: true
  sourceNamespace: "default"
  targetNamespace: "org-*"

vpol:
  enabled: false

wcIpCheck:
  enabled: true
  deriveFromControlPlaneEndpoint:
    enabled: true

proxy:
  enabled: true
  namespaces: ["default", "kube-system", "kube-public"]

cluster:
  name: "test"
  proxy:
    http: "http://proxy.example.com:8080"
    https: "https://proxy.example.com:8080"
    noProxy: ""

certManager:
  syncSecret: true
  sourceNamespace: "default"
  targetNamespace: "org-*"

cel:
  enabled: false

wcIpCheck:
  enabled: true
  infraClusterNames:
  - VSphereCluster
  exclude:
    names:
    - excluded-by-name
  deriveFromControlPlaneEndpoint:
    enabled: true
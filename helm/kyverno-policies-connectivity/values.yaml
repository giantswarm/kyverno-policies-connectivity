certManager:
  sourceNamespace: ""
  syncSecret: false
  targetNamespace: "org-*"

proxy:
  enabled: false
  http: ""
  https: ""
  noProxy: ""
  # Namespaces whose pods get the proxy env vars. Like the other proxy keys, an empty
  # value falls back to cluster.proxy.namespaces; with both empty, all namespaces match.
  namespaces: []  # @schema item: string

cluster:
  name: ""
  proxy:
    http: ""
    https: ""
    noProxy: ""
    namespaces: []  # @schema item: string

exclude:
  names:
  - "capi-*"
  - "dex-k8s-*"

wcIpCheck:
  enabled: false
  validationFailureAction: Enforce  # @schema enum: [Audit, Enforce]
  infraClusterNames:  # don't put general CAPI Cluster here, ip to this CR should be assigned by the infra controller
  - "VSphereCluster"
  # explicit IP ranges from which the IPs can be set to WC's control planes, e.g.
  # - start: 10.10.222.242
  #   end: 10.10.222.249
  ipRanges: []  # @schema itemRef: schemas/ip-range.json
  # Following options are used for calculating the range dynamically from the MC's control plane ip
  deriveFromControlPlaneEndpoint:  # should the ipRange be automatically figured out from the IP pertaining to control plane?
    enabled: false
    offset: 2  # first ip of the range will be calculated as controlPlaneEndpoint.host + this
    number: 8  # how large the ip range should be
  exclude:
    names: []  # @schema item: string
  installJob:
    securityContext:
      runAsGroup: 1000
      runAsUser: 1000
    kubectlImage:
      registry: gsoci.azurecr.io
      name: giantswarm/kubectl
      tag: 1.26.0
